# Conda environment file for GeoBlocks
# Use: conda env create -f environment.yml

name: geoblocks

channels:
  - conda-forge
  - defaults

dependencies:
  - python>=3.8
  
  # Core scientific computing
  - numpy>=1.20.0
  - scipy>=1.8.0
  - pandas>=1.4.0
  
  # Geological modeling
  - gempy>=2.3.0
  
  # NURBS and geometric modeling  
  - geomdl>=5.3.0
  
  # Visualization and plotting
  - matplotlib>=3.5.0
  - plotly>=5.10.0
  - pyvista>=0.36.0
  
  # Interactive widgets
  - ipywidgets>=7.7.0
  - ipykernel>=6.15.0
  
  # GUI frameworks
  - pyqt>=5.15.0
  - pygame>=2.1.0
  
  # Spatial analysis
  - pykrige>=1.6.0
  
  # Jupyter ecosystem
  - jupyter>=1.0.0
  - notebook>=6.4.0
  
  # Data handling
  - openpyxl>=3.0.0
  
  # Performance optimization
  - numba>=0.56.0
  
  # Development tools (optional)
  - black  # Code formatting
  - flake8  # Linting
  - pytest  # Testing
  
  # System dependencies that may be needed
  - vtk  # For PyVista 3D visualization
  - gdal  # For geospatial data (optional)